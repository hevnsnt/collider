name: Build Free Edition

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  # Linux x86_64 with CUDA
  # ============================================================================
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu22.04
    
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          git \
          build-essential \
          libssl-dev \
          wget \
          file \
          ca-certificates \
          software-properties-common \
          gpg
        # Install CMake 3.28+ (Ubuntu 22.04 ships 3.22 which doesn't support CUDA C++20)
        wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main" > /etc/apt/sources.list.d/kitware.list
        apt-get update
        apt-get install -y cmake
        cmake --version
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCOLLIDER_EDITION_PRO=OFF \
          -DCOLLIDER_USE_CUDA=ON \
          -DCOLLIDER_BUILD_TESTS=OFF \
          -DCOLLIDER_BUILD_BENCHMARKS=OFF \
          -DCOLLIDER_BUILD_TOOLS=OFF \
          -DCMAKE_CUDA_ARCHITECTURES="75;86;89"
    
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target collider --parallel 4
    
    - name: Strip and verify
      run: |
        strip build/collider
        ls -lh build/collider
        file build/collider
    
    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: collider-linux-x64
        path: build/collider
        retention-days: 30

  # ============================================================================
  # Windows x64 with CUDA
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.19
      with:
        cuda: '12.6.2'
        method: 'network'
        sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
    
    - name: Install vcpkg dependencies
      run: |
        vcpkg install --triplet x64-windows --no-print-usage
      shell: pwsh
    
    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DCOLLIDER_EDITION_PRO=OFF `
          -DCOLLIDER_USE_CUDA=ON `
          -DCOLLIDER_BUILD_TESTS=OFF `
          -DCOLLIDER_BUILD_BENCHMARKS=OFF `
          -DCOLLIDER_BUILD_TOOLS=OFF `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCUDA_ARCHITECTURES="75;86;89"
      shell: pwsh
    
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target collider --parallel 4
    
    - name: Verify binary
      run: |
        Get-Item build\Release\collider.exe | Format-List Name, Length
      shell: pwsh
    
    - name: Upload Windows binary
      uses: actions/upload-artifact@v4
      with:
        name: collider-windows-x64
        path: build/Release/collider.exe
        retention-days: 30

  # ============================================================================
  # macOS ARM64 with Metal
  # ============================================================================
  build-macos:
    runs-on: macos-14  # Apple Silicon
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Install dependencies
      run: |
        brew update
        brew install cmake openssl
    
    - name: Configure CMake
      run: |
        export OPENSSL_ROOT_DIR=$(brew --prefix openssl)
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCOLLIDER_EDITION_PRO=OFF \
          -DCOLLIDER_USE_CUDA=OFF \
          -DCOLLIDER_USE_METAL=ON \
          -DCOLLIDER_BUILD_TESTS=OFF \
          -DCOLLIDER_BUILD_BENCHMARKS=OFF \
          -DCOLLIDER_BUILD_TOOLS=OFF \
          -DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR
    
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target collider --parallel 4
    
    - name: Verify binary
      run: |
        ls -lh build/collider
        file build/collider
        otool -L build/collider || true

    - name: Upload macOS binary
      uses: actions/upload-artifact@v4
      with:
        name: collider-macos-arm64
        path: build/collider
        retention-days: 30

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
    
    - name: Prepare release files
      run: |
        mkdir -p release/
        cp artifacts/collider-linux-x64/collider release/collider
        chmod +x release/collider
        cp artifacts/collider-windows-x64/collider.exe release/collider.exe
        cp artifacts/collider-macos-arm64/collider release/collider-macos-arm64
        chmod +x release/collider-macos-arm64
        cd release/ && sha256sum * > SHA256SUMS.txt
        ls -la && cat SHA256SUMS.txt
    
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event.inputs.version }}" != "" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="dev-$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
        fi
        echo "version=v$VERSION" >> $GITHUB_OUTPUT
        echo "Version: v$VERSION"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: "Collider ${{ steps.version.outputs.version }}"
        body: |
          ## Collider Free Edition ${{ steps.version.outputs.version }}

          GPU-accelerated Bitcoin Puzzle Solver - Pool Edition

          ### Downloads:
          - **Linux x64 (CUDA)**: `collider`
          - **Windows x64 (CUDA)**: `collider.exe`
          - **macOS ARM64 (Metal)**: `collider-macos-arm64`

          ### Verify:
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          **Built from**: `${{ github.ref_name }}` @ `${{ github.sha }}`
        draft: false
        prerelease: ${{ github.event.inputs.version == 'dev' || github.event.inputs.version == '' }}
        files: release/*