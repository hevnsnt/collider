name: CI Build

# Build-only validation for PRs and pushes to main / full-opto.
# Mirrors the toolchain matrix in release.yml but skips packaging
# and artifact upload -- this is a "does it compile + link on each
# platform" gate, not a release pipeline.

on:
  pull_request:
    branches:
      - main
      - full-opto
  push:
    branches:
      - main
      - full-opto
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  # Linux x64 + CUDA
  # ---------------------------------------------------------------------------
  linux-cuda:
    name: Linux x64 (CUDA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.0"
          method: "network"
          sub-packages: '["nvcc", "cudart"]'

      - name: Configure (FREE build, COLLIDER_PRO=OFF)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCOLLIDER_PRO=OFF \
            -DCOLLIDER_USE_CUDA=ON \
            -DCOLLIDER_BUILD_TESTS=OFF \
            -DCOLLIDER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89;120"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j4

  # ---------------------------------------------------------------------------
  # Windows x64 + CUDA
  # ---------------------------------------------------------------------------
  windows-cuda:
    name: Windows x64 (CUDA)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.0"
          method: "network"
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure (FREE build, COLLIDER_PRO=OFF)
        env:
          VCPKG_ROOT: 'C:\vcpkg'
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCOLLIDER_PRO=OFF `
            -DCOLLIDER_USE_CUDA=ON `
            -DCOLLIDER_BUILD_TESTS=OFF `
            -DCOLLIDER_BUILD_BENCHMARKS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89;120"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j4

  # ---------------------------------------------------------------------------
  # macOS arm64 + Metal
  # ---------------------------------------------------------------------------
  macos-metal:
    name: macOS arm64 (Metal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: brew install cmake ninja

      - name: Configure (FREE build, COLLIDER_PRO=OFF, Metal backend)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCOLLIDER_PRO=OFF \
            -DCOLLIDER_USE_CUDA=OFF \
            -DCOLLIDER_USE_METAL=ON \
            -DCOLLIDER_BUILD_TESTS=OFF \
            -DCOLLIDER_BUILD_BENCHMARKS=OFF

      - name: Build (FREE)
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j4

      # v1.4.0: Pro build coverage on Mac. The free build above doesn't
      # exercise brain_wallet_gpu.hpp (the Pro brain-wallet pipeline)
      # or rckangaroo_wrapper.cu, both of which include cuda* type
      # references that need correct stubs in the !COLLIDER_USE_CUDA
      # path. Without this job, regressions like the cudaEvent_t stub
      # miss in fed3c05 would only surface when an operator tried to
      # build Pro on Mac. Separate build dir so the FREE configure/build
      # cache stays clean.
      #
      # The hashFiles() gate means these steps run only when the Pro
      # generator headers are present in the checkout. On the public
      # `collider` repo, sync-to-free.sh strips src/generators/, so the
      # gate evaluates to '' and the Pro steps skip cleanly instead of
      # turning the FREE-repo CI red on a missing-include.
      - name: Configure (PRO build, COLLIDER_PRO=ON, Metal backend)
        if: hashFiles('src/generators/pcfg.hpp') != ''
        run: |
          cmake -B build_pro -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCOLLIDER_PRO=ON \
            -DCOLLIDER_USE_CUDA=OFF \
            -DCOLLIDER_USE_METAL=ON \
            -DCOLLIDER_BUILD_TESTS=OFF \
            -DCOLLIDER_BUILD_BENCHMARKS=OFF

      - name: Build (PRO)
        if: hashFiles('src/generators/pcfg.hpp') != ''
        run: cmake --build build_pro --config ${{ env.BUILD_TYPE }} -j4
