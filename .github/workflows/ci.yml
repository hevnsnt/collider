name: CI Build

# Build-only validation for PRs and pushes to main.
# Builds BOTH the Free and Pro editions on each platform so regressions
# in either are caught before a release tag is pushed.

on:
  pull_request:
    branches:
      - main
      - full-opto
  push:
    branches:
      - main
      - full-opto
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  # Linux x64 + CUDA  (Free + Pro)
  # ---------------------------------------------------------------------------
  linux-cuda:
    name: Linux x64 (CUDA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.0"
          method: "network"
          sub-packages: '["nvcc", "cudart"]'

      - name: Configure (FREE)
        run: |
          cmake -B build_free -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCOLLIDER_PRO=OFF \
            -DCOLLIDER_USE_CUDA=ON \
            -DCOLLIDER_BUILD_TESTS=OFF \
            -DCOLLIDER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89;120"

      - name: Build (FREE)
        run: cmake --build build_free --config ${{ env.BUILD_TYPE }} -j4

      - name: Configure (PRO)
        run: |
          cmake -B build_pro -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCOLLIDER_PRO=ON \
            -DCOLLIDER_USE_CUDA=ON \
            -DCOLLIDER_BUILD_TESTS=OFF \
            -DCOLLIDER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89;120"

      - name: Build (PRO)
        run: cmake --build build_pro --config ${{ env.BUILD_TYPE }} -j4

  # ---------------------------------------------------------------------------
  # Windows x64 + CUDA  (Free + Pro)
  # ---------------------------------------------------------------------------
  windows-cuda:
    name: Windows x64 (CUDA)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.0"
          method: "network"
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure (FREE)
        env:
          VCPKG_ROOT: 'C:\vcpkg'
        run: |
          cmake -B build_free -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCOLLIDER_PRO=OFF `
            -DCOLLIDER_USE_CUDA=ON `
            -DCOLLIDER_BUILD_TESTS=OFF `
            -DCOLLIDER_BUILD_BENCHMARKS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89;120"

      - name: Build (FREE)
        run: cmake --build build_free --config ${{ env.BUILD_TYPE }} -j4

      - name: Configure (PRO)
        env:
          VCPKG_ROOT: 'C:\vcpkg'
        run: |
          cmake -B build_pro -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCOLLIDER_PRO=ON `
            -DCOLLIDER_USE_CUDA=ON `
            -DCOLLIDER_BUILD_TESTS=OFF `
            -DCOLLIDER_BUILD_BENCHMARKS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES="75;86;89;120"

      - name: Build (PRO)
        run: cmake --build build_pro --config ${{ env.BUILD_TYPE }} -j4

  # ---------------------------------------------------------------------------
  # macOS arm64 + Metal  (Free + Pro)
  # Tags, PRs, and manual only -- skipped on plain main pushes to avoid
  # burning 10x-multiplier minutes on routine commits.
  # ---------------------------------------------------------------------------
  macos-metal:
    name: macOS arm64 (Metal)
    if: github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: brew install cmake ninja

      - name: Configure (FREE)
        run: |
          cmake -B build_free -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCOLLIDER_PRO=OFF \
            -DCOLLIDER_USE_CUDA=OFF \
            -DCOLLIDER_USE_METAL=ON \
            -DCOLLIDER_BUILD_TESTS=OFF \
            -DCOLLIDER_BUILD_BENCHMARKS=OFF

      - name: Build (FREE)
        run: cmake --build build_free --config ${{ env.BUILD_TYPE }} -j4

      - name: Configure (PRO)
        if: hashFiles('src/generators/pcfg.hpp') != ''
        run: |
          cmake -B build_pro -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCOLLIDER_PRO=ON \
            -DCOLLIDER_USE_CUDA=OFF \
            -DCOLLIDER_USE_METAL=ON \
            -DCOLLIDER_BUILD_TESTS=OFF \
            -DCOLLIDER_BUILD_BENCHMARKS=OFF

      - name: Build (PRO)
        if: hashFiles('src/generators/pcfg.hpp') != ''
        run: cmake --build build_pro --config ${{ env.BUILD_TYPE }} -j4
