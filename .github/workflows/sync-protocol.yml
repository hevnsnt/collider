name: Sync JLP Protocol to collision-protocol

# Pushes the generated Python protocol module
# (data/protocol/jlp_protocol_generated.py) to the collision-protocol
# server repo whenever the IDL or codegen changes on pro/main. The two
# repos talk over the JLP wire format, so this is the path that
# guarantees the C++ client and the Python pool server see the same
# bytes on the wire.
#
# Required secret: SYNC_DEPLOY_KEY
#   A SSH private key that has push access to
#   github.com/hevnsnt/collision-protocol. Set in
#   pro/Settings -> Secrets -> Actions.
#
# Pre-flight: --check on the codegen verifies the committed generated
# files are not stale before we push them.

on:
  push:
    branches:
      - main
    paths:
      - "protocol/jlp.yaml"
      - "tools/codegen/jlp_codegen.py"
      - "data/protocol/jlp_protocol_generated.py"
  workflow_dispatch:

jobs:
  sync:
    name: Push generated protocol module to collision-protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codegen deps
        run: pip install pyyaml pytest

      - name: Verify generated files match IDL (drift check)
        run: python tools/codegen/jlp_codegen.py --check

      - name: Run protocol smoke tests
        run: python -m pytest tests/protocol -v

      - name: Set up SSH for collision-protocol push
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Clone collision-protocol
        run: |
          git clone git@github.com:hevnsnt/collision-protocol.git target
          cd target
          git config user.email "hevnsnt@gmail.com"
          git config user.name  "JLP Protocol Sync (automated)"

      - name: Copy generated protocol module
        run: |
          mkdir -p target/src/protocol
          cp data/protocol/jlp_protocol_generated.py \
             target/src/protocol/jlp_protocol_generated.py
          # Make the directory a package so `src.protocol.jlp_protocol_generated`
          # is importable from the hand-written src/jlp_protocol.py drift check.
          if [ ! -f target/src/protocol/__init__.py ]; then
            touch target/src/protocol/__init__.py
          fi

      - name: Commit and push if changed
        run: |
          cd target
          git add src/protocol/jlp_protocol_generated.py src/protocol/__init__.py
          if git diff --cached --quiet; then
            echo "No protocol drift; nothing to push."
            exit 0
          fi
          PRO_SHA="${GITHUB_SHA::7}"
          git commit -m "Sync JLP protocol bindings from collider-pro@${PRO_SHA}

Auto-generated by .github/workflows/sync-protocol.yml.
Source: protocol/jlp.yaml in collider-pro."
          git push origin HEAD
